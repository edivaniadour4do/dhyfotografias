  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Configuração de Cores da Identidade Visual -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#0a0b0d',
              dark: '#121418',
              card: '#181b22',
              white: '#ffffff',
              green: '#10b981',        /* Verde Esmeralda */
              'green-dark': '#059669',
              'green-soft': '#d1fae5',
              pink: '#ec4899',         /* Rosa Vibrante */
              'pink-dark': '#db2777',
              'pink-soft': '#fce7f3',
            }
          }
        }
      }
    }
  </script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    
    .glow-green {
      box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.35);
    }
    .glow-pink {
      box-shadow: 0 0 35px -5px rgba(236, 72, 153, 0.35);
    }
    .gradient-border-glow {
      background: linear-gradient(135deg, #ec4899, #10b981);
    }
    
    /* Efeito suave de aproximação nas fotos */
    .portfolio-img {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .portfolio-card:hover .portfolio-img {
      transform: scale(1.06);
    }
  </style>
</head>
